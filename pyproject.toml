[project]
name = "wikistar"
version = "2.0.0"
description = "WikiSTAR — Wikipedia editathon submission, review and self-assessment tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "a2wsgi>=1.10",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
