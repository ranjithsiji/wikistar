[uwsgi]
# MediaWiki OAuth 2.0 callback URLs carry a ~1.2 KB authorization code;
# together with the Toolforge proxy headers the request exceeds uwsgi's
# default 4096-byte buffer, and uwsgi then resets the connection before
# sending headers ("upstream connect error ... connection termination").
#
# Toolforge merges this file from ~/www/python/uwsgi.ini, so on deploy:
#   cp ~/www/python/src/uwsgi.ini ~/www/python/uwsgi.ini
buffer-size = 32768

# Several endpoints block on MediaWiki/Wikidata API calls (up to 15 s
# each). With single-threaded workers, one slow wiki fetch queues every
# other request behind it; threads keep the tool responsive while a
# request waits on the wiki. The app is thread-safe: the DB session is
# request-scoped (scoped_session = thread-local) and the shared httpx
# client is thread-safe. Eight threads, not four: the read paths are
# plain SQL now and finish in milliseconds, so almost every occupied
# thread is just waiting on wiki I/O — cheap to run more of.
enable-threads = true
threads = 8
