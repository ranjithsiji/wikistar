[uwsgi]
# MediaWiki OAuth 2.0 callback URLs carry a ~1.2 KB authorization code;
# together with the Toolforge proxy headers the request exceeds uwsgi's
# default 4096-byte buffer, and uwsgi then resets the connection before
# sending headers ("upstream connect error ... connection termination").
#
# Toolforge merges this file from ~/www/python/uwsgi.ini, so on deploy:
#   cp ~/www/python/src/uwsgi.ini ~/www/python/uwsgi.ini
buffer-size = 32768
