[project]
name = "wikistar"
version = "2.1.0"
description = "WikiSTAR — Wikipedia editathon submission, review and self-assessment tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "authlib>=1.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "flask>=3.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
